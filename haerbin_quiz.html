<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>你了解哈尔滨吗？</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{font-family:"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;background:#0d1520;color:#fff;min-height:100vh;overflow-x:hidden}



/* ===== FULL-SCREEN BACKGROUND ===== */

.quiz-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-image 0.5s ease}

.quiz-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(0,0,0,0.05) 30%,rgba(0,0,0,0.15) 60%,rgba(0,0,0,0.55) 85%,rgba(0,0,0,0.7) 100%)}



/* ===== START PAGE ===== */

.start-page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,#0d1520 0%,#111d2a 30%,#0d1520 100%)}

.start-logo{width:80px;height:80px;border:1.5px solid rgba(200,159,92,0.4);border-radius:50%;margin-bottom:28px;position:relative}

.start-logo::after{content:'';position:absolute;inset:6px;border:1px solid rgba(200,159,92,0.25);border-radius:50%}

.start-logo .dot{position:absolute;width:6px;height:6px;background:#c89f5c;border-radius:50%;top:50%;left:50%;margin:-3px 0 0 -3px;box-shadow:0 0 16px rgba(200,159,92,0.6)}

.start-title{font-family:"Noto Serif SC","SimSun",serif;font-size:32px;font-weight:700;color:#c89f5c;letter-spacing:4px;margin-bottom:8px}

.start-sub{font-size:13px;color:rgba(200,159,92,0.45);letter-spacing:2px;margin-bottom:36px}

.start-btn{display:inline-block;padding:14px 60px;font-size:15px;font-weight:500;color:#c89f5c;background:rgba(200,159,92,0.06);border:1px solid rgba(200,159,92,0.25);border-radius:50px;cursor:pointer;letter-spacing:3px;transition:all 0.35s;outline:none;-webkit-tap-highlight-color:transparent;user-select:none}

.start-btn:hover{background:rgba(200,159,92,0.12);border-color:rgba(200,159,92,0.5);box-shadow:0 0 32px rgba(200,159,92,0.12)}

.start-btn:active{transform:scale(0.96)}



/* ===== SNOW ===== */

.snow{position:fixed;inset:0;z-index:3;pointer-events:none}

.snowflake{position:absolute;color:#fff;font-size:14px;animation:fall linear infinite;opacity:0.55}

@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg)}100%{transform:translateY(110vh) rotate(360deg)}}



/* ===== QUIZ PAGE ===== */

.quiz-page{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;overflow:hidden;touch-action:manipulation}

.quiz-page.show{display:flex}



/* Top bar */

.quiz-top{display:flex;justify-content:space-between;align-items:flex-start;padding:50px 24px 0;position:relative;z-index:2}

.quiz-chapter{display:flex;flex-direction:column}

.ch-badge{display:inline-block;padding:3px 12px;font-size:11px;color:#c89f5c;background:rgba(200,159,92,0.12);border:1px solid rgba(200,159,92,0.25);border-radius:4px;letter-spacing:2px;margin-bottom:6px;width:fit-content}

.ch-title{font-size:26px;font-weight:700;color:#fff;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,0.5)}

.ch-sub{font-size:12px;color:rgba(255,255,255,0.5);letter-spacing:1px;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,0.5)}

.quiz-progress{text-align:right;padding-top:4px}

.prog-num{font-size:28px;font-weight:300;color:#fff;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,0.5)}

.prog-label{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,0.5)}

.prog-bar{width:80px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:6px;overflow:hidden}

.prog-fill{height:100%;background:#c89f5c;border-radius:2px;transition:width 0.4s ease}



/* Question card */

.quiz-card-area{flex:1;display:flex;flex-direction:column;padding:0;position:relative;z-index:2;overflow:hidden;touch-action:manipulation}

/* Image full-screen */

.q-img-wrap{display:none;position:fixed;inset:0;z-index:1}

.q-img-wrap.show{display:block}

.q-img-top{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}

/* Card floats on top */

.q-card{position:absolute;left:16px;right:16px;background:rgba(20,28,42,0.3);border-radius:14px;padding:10px 14px 8px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 0 40px rgba(0,0,0,0.5)}

.q-nav{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center}

.submit-wrap{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center}

.q-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}

.q-num{font-size:11px;color:#c89f5c;font-weight:600;letter-spacing:2px}

.q-text{font-size:13px;font-weight:600;line-height:1.3;color:#f0f0f0;margin-bottom:6px}

.q-options{display:flex;flex-direction:column;gap:5px}

.q-opt{display:flex;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8);font-size:12px;cursor:pointer;transition:all 0.2s;position:relative;outline:none;-webkit-tap-highlight-color:transparent;user-select:none}

.q-opt .let{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;margin-right:8px;flex-shrink:0;color:rgba(255,255,255,0.5);transition:all 0.2s}

.q-opt:hover{border-color:rgba(200,159,92,0.35);background:rgba(200,159,92,0.06)}

.q-opt.selected{background:rgba(200,159,92,0.18);border-color:rgba(200,159,92,0.5);color:#f5e6cc}

.q-opt.selected .let{background:rgba(200,159,92,0.25);border-color:rgba(200,159,92,0.5);color:#c89f5c}

.q-opt.correct{background:rgba(80,200,140,0.1);border-color:rgba(80,200,140,0.25);color:#c0e8d0}

.q-opt.correct .let{background:rgba(80,200,140,0.18);border-color:rgba(80,200,140,0.35);color:#80c880}

.q-opt.wrong{background:rgba(200,80,80,0.1);border-color:rgba(200,80,80,0.2);color:#e0c0c0}

.q-opt.wrong .let{background:rgba(200,80,80,0.15);border-color:rgba(200,80,80,0.3);color:#cc7070}

.q-opt.answered{cursor:default;pointer-events:none}

.q-opt .check{position:absolute;right:10px;font-size:14px;font-weight:700;display:none}

.q-opt.correct .check,.q-opt.wrong .check{display:block}



/* Card footer */

.q-footer{margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.06);text-align:center}

.q-feedback{font-size:10px;color:rgba(200,159,92,0.6);text-align:center}



/* Nav buttons - below card */

.nav-btn{width:36px;height:36px;border-radius:50%;background:rgba(20,28,42,0.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;outline:none;-webkit-tap-highlight-color:transparent;user-select:none}

.nav-btn:hover,.nav-btn:active{background:rgba(200,159,92,0.15);border-color:rgba(200,159,92,0.3);color:#c89f5c}

.nav-btn.hidden{opacity:0;pointer-events:none}

.submit-btn{padding:12px 40px;font-size:13px;font-weight:600;color:#0d1520;background:linear-gradient(135deg,#c89f5c,#a07840);border:none;border-radius:50px;cursor:pointer;letter-spacing:2px;transition:all 0.3s;outline:none;box-shadow:0 4px 20px rgba(200,159,92,0.3);-webkit-tap-highlight-color:transparent;user-select:none}

.submit-btn:hover{box-shadow:0 6px 28px rgba(200,159,92,0.45);transform:translateY(-1px)}

.submit-btn:active{transform:scale(0.96)}



/* ===== RESULT PAGE ===== */

.result-page{position:relative;z-index:2;min-height:100vh;display:none;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,#0d1520 0%,#111d2a 50%,#0d1520 100%)}

.result-page.show{display:flex}

.result-card{width:100%;max-width:360px;background:rgba(13,21,32,0.6);border-radius:20px;padding:32px 24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06);box-shadow:0 8px 48px rgba(0,0,0,0.35);text-align:center;margin:0 20px}

.r-label{font-size:11px;color:rgba(200,159,92,0.35);letter-spacing:4px;margin-bottom:4px}

.r-score{font-family:"Noto Serif SC","SimSun",serif;font-size:80px;font-weight:900;color:#c89f5c;line-height:1;margin:8px 0 0}

.r-id{font-size:22px;font-weight:700;color:#e8d8b8;margin:10px 0 6px}

.r-desc{font-size:13px;color:#a0a8b8;line-height:1.7;margin:8px 0 16px}

.r-divider{width:60px;height:1px;background:rgba(200,159,92,0.2);margin:16px auto}

.r-tag{font-size:13px;color:#c89f5c;font-style:italic}

.detail-bars{text-align:left;margin:20px 0}

.detail-bar{margin-bottom:10px}

.dl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;color:rgba(255,255,255,0.35)}

.dv{color:rgba(200,159,92,0.6)}

.dt{height:3px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden}

.df{height:100%;border-radius:2px;transition:width 1.2s ease}

.restart-btn{display:inline-block;padding:12px 44px;font-size:14px;color:#c89f5c;background:transparent;border:1px solid rgba(200,159,92,0.2);border-radius:50px;cursor:pointer;letter-spacing:2px;margin-top:12px;transition:all 0.3s;outline:none;user-select:none}

.restart-btn:hover{background:rgba(200,159,92,0.08);border-color:rgba(200,159,92,0.4)}

.share-btn{display:inline-block;padding:12px 44px;font-size:14px;color:#c89f5c;background:transparent;border:1px solid rgba(200,159,92,0.2);border-radius:50px;cursor:pointer;letter-spacing:2px;margin-top:12px;transition:all 0.3s;outline:none;user-select:none}

.share-btn:hover{background:rgba(200,159,92,0.08);border-color:rgba(200,159,92,0.4)}

/* ===== DESKTOP ===== */
@media(min-width:768px){
  .q-img-top{background-size:contain;background-color:#0d1520}
}

</style>
</head>
<body>
<div class="quiz-bg" id="quizBg"></div>
<div class="snow" id="snow"></div>

<div class="start-page" id="startPage">

  <button class="start-btn" id="startBtn">开始答题</button>
</div>

<!-- QUIZ PAGE -->
<div class="quiz-page" id="quizPage">

    <div class="quiz-chapter">
      <span class="ch-badge" id="chBadge"></span>

      <div class="ch-sub" id="chSub"></div>

        <div class="q-feedback" id="fb"></div>
      </div>

    </div>
    <div class="submit-wrap" id="submitWrap">
      <button class="submit-btn" id="subBtn" style="display:none">提交答卷</button>
    </div>
  </div>

</div>

<!-- RESULT PAGE -->
<div class="result-page" id="resultPage">
  <div class="result-card">
    <div class="r-label">ICE CITY QUIZ</div>
    <div class="r-score" id="rScore">0</div>

    <button class="share-btn" id="shareBtn">分享好友</button>
    <button class="share-btn" id="cardBtn">保存图片</button>
  </div>
</div>

  // ===== RENDER =====

    // Options

  // ===== SELECT ANSWER =====
  function selectAnswer(idx) {
    if (userAnswers[currentIndex] !== -1) return;

    userAnswers[currentIndex] = idx;
    isCorrect[currentIndex] = (idx === qs[currentIndex].a);

    var opts = $("qOpts").children;
    for (var i = 0; i < opts.length; i++) {
      opts[i].classList.add("answered");
      if (i === idx) {
        opts[i].classList.add("selected");
        opts[i].classList.add(isCorrect[currentIndex] ? "correct" : "wrong");
      }
      if (i === qs[currentIndex].a) {
        opts[i].classList.add("correct");
      }
      var ck = opts[i].querySelector(".check");
      if (ck) {
        if (i === qs[currentIndex].a && i !== idx) {
          ck.style.display = "block";
          ck.textContent = "\u2713";
          ck.style.color = "#80c880";
        } else if (i === idx && isCorrect[currentIndex]) {
          ck.style.display = "block";
          ck.textContent = "\u2713";
          ck.style.color = "#80c880";
        } else if (i === idx && !isCorrect[currentIndex]) {
          ck.style.display = "block";
          ck.textContent = "\u2717";
          ck.style.color = "#cc7070";
        }
      }
    }

    $("fb").textContent = isCorrect[currentIndex] ? "回答正确 \u2713" : "再想想，下次一定对 \u2717";
  }

  // ===== NAVIGATION =====
  function nextQuestion() {
    if (userAnswers[currentIndex] === -1) return;
    if (currentIndex < 49) { currentIndex++; renderQuestion(); }
  }

  // ===== START =====
  function startQuiz() {
    currentIndex = 0;

    $("submitWrap").style.display = "flex";
    renderQuestion();
  }

  // ===== SUBMIT =====
  function submitQuiz() {
    var unanswered = [];
    for (var i = 0; i < 50; i++) { if (userAnswers[i] === -1) unanswered.push(i + 1); }
    if (unanswered.length > 0) {
      var preview = unanswered.slice(0, 5).join("\u3001");
      var msg = "下列题目未作答：" + preview + (unanswered.length > 5 ? "等" + unanswered.length + "题" : "") + "\n\n确认提交吗？";
      if (!confirm(msg)) return;
    }

    var totalScore = 0;
    var catScore = [0,0,0,0,0];
    var catTotal = [0,0,0,0,0];
    for (var i = 0; i < 50; i++) {
      catTotal[qs[i].c] += qs[i].s;
      if (isCorrect[i]) { totalScore += qs[i].s; catScore[qs[i].c] += qs[i].s; }
    }

    // Score ID
    var ids = ["欢迎来尔滨","离家游子","半个尔滨人","尔滨老铁","最佳尔滨人"];

      cardOverlay.style.display = "flex";
    }

    if (shareBg.complete && shareBg.naturalWidth > 0) {
      draw();
    } else {
      shareBg.onload = draw;
    }
  });
  // ===== SWIPE SUPPORT (answered only) =====
  var touchStartX = 0;
  document.addEventListener("touchstart", function(e) { touchStartX = e.touches[0].clientX; });
  document.addEventListener("touchend", function(e) {
    if (!$("quizPage").classList.contains("show")) return;
    if (userAnswers[currentIndex] === -1) return;
    var diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 60) {
      nextQuestion();
    }
  });

})();
</script>
</body>
</html>
